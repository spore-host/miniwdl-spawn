[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniwdl-spawn"
version = "0.2.0"
description = "miniwdl container backend that runs each WDL task on an ephemeral EC2 instance via spore-host/spawn"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "scttfrdmn" }]
keywords = ["wdl", "miniwdl", "bioinformatics", "aws", "ec2", "workflow", "spawn"]
dependencies = [
    "miniwdl>=1.12",
]

[project.optional-dependencies]
# ruff is capped below 0.16: that release moved a large set of opinionated rules
# (BLE, PLW, TRY, C408, EXE, B017, UP035, …) into the DEFAULT rule set, so an
# unpinned `ruff check .` silently changes what CI enforces whenever ruff
# publishes — the lint here went red with no code change on our side. Same cap as
# airflow-spawn and snakemake-executor-plugin-spawn. Raising it is a deliberate
# change: pick the rules to adopt via an explicit `[tool.ruff.lint] select`,
# don't inherit them.
# `pyyaml` is a test-only dependency: tests/test_ci_hygiene.py parses
# .github/dependabot.yml. It is imported unguarded there on purpose — a
# try/except import degrades to a skip, and a skipped wiring test reports green
# while asserting nothing.
dev = ["pytest>=7", "ruff>=0.5,<0.16", "mypy>=1.8", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/spore-host/miniwdl-spawn"
Issues = "https://github.com/spore-host/spore-host/issues/395"

# This is what makes miniwdl discover the backend: `miniwdl run --cfg
# scheduler.container_backend=spawn` resolves this entry point. Mirrors how
# miniwdl's built-ins register (e.g. singularity = WDL.runtime.backend.singularity:SingularityContainer).
[project.entry-points."miniwdl.plugin.container_backend"]
spawn = "miniwdl_spawn.backend:SpawnContainer"

[tool.setuptools.packages.find]
include = ["miniwdl_spawn*"]

[tool.ruff]
line-length = 100
target-version = "py39"

# Runtime supports 3.9+; mypy's analysis target is 3.10 (its minimum).
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
