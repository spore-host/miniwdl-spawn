name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy miniwdl_spawn

      - name: Test (pytest)
        run: pytest -q

      # The half of pin hygiene that needs the network, so it can't live in the
      # (hermetic) pytest suite: does each pin's `# vX.Y.Z` actually name the tag
      # its SHA carries? A wrong label is worse than none — it makes a
      # major-version jump read as a routine same-line bump, which is how a
      # checkout v6 -> v7.0.1 bump nearly landed in nf-spawn labelled `# v6`.
      # Read-only (git ls-remote), no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh
